---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-music
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 172.16.20.5
    path: /danscrib/musik/FLAC
    readOnly: true
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-mixes
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: 172.16.20.5
    path: /danscrib/musik/Mixes
    readOnly: true
