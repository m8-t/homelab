---
apiVersion: v1
kind: Service
metadata:
  name: wiim-bridge
  namespace: navidrome
  labels:
    app: wiim-bridge
spec:
  selector:
    app: wiim-bridge
  ports:
    - name: http
      port: 8098
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: wiim-bridge-lan
  namespace: navidrome
  labels:
    app: wiim-bridge
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.16.20.111"
spec:
  type: LoadBalancer
  selector:
    app: wiim-bridge
  ports:
    - name: device
      port: 8099
      targetPort: device
