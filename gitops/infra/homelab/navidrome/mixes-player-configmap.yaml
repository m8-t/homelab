    function svgEl(name, attrs, parent) {
      const el = document.createElementNS(SVGNS, name);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      if (parent) parent.appendChild(el);
      return el;
    }

    function hashId(id) {
      let h = 2166136261;
      for (let i = 0; i < id.length; i++) h = Math.imul(h ^ id.charCodeAt(i), 16777619);
      return h >>> 0;
    }

    function tracksOf(mix) {
      return (Array.isArray(mix.tracks) ? mix.tracks : [])
        .filter((t) => t && typeof t.start_seconds === 'number')
        .sort((a, b) => a.start_seconds - b.start_seconds);
    }

    function dateOf(mix) {
      const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(mix.date || ''));
      return m ? `${m[3]}.${m[2]}.${m[1]}` : '';
    }

    function minutesOf(mix) {
      return mix.duration_seconds > 0 ? `${Math.round(mix.duration_seconds / 60)} min` : '';
    }

    function deckId() {
      return mode === 'tape' ? tape.id : state.id;
    }

    // Same title twice among the shown mixes: add the folder's "(n)" suffix, else fall back to the folder name.
    function labelsFor(items) {
      const base = items.map((m) => (m.mix.title ? String(m.mix.title) : m.id));
      const count = (arr) => arr.reduce((o, t) => ((o[t] = (o[t] || 0) + 1), o), {});
      let c = count(base);
      const withSuffix = base.map((t, i) => {
        if (c[t] < 2) return t;
        const m = /\((\d+)\)\s*$/.exec(items[i].id);
        return m ? `${t} (${m[1]})` : t;
      });
      c = count(withSuffix);
      return withSuffix.map((t, i) => (c[t] > 1 ? items[i].id : t));
    }

    function fitText(el, maxW, maxSize) {
      el.setAttribute('font-size', String(maxSize));
      const w = el.getComputedTextLength();
      if (w > maxW) el.setAttribute('font-size', (maxSize * maxW / w).toFixed(2));
    }

    function fitAll() {
      document.querySelectorAll('#tapes text').forEach((t) => fitText(t, Number(t.dataset.w), Number(t.dataset.max)));
    }

    // Maps the upright spine image (SHELF.spine) onto a slot quad (TL, TR, BR, BL).
    function quadMatrix(q) {
      const [W, H] = SHELF.spine;
      const a = (q[1][0] - q[0][0]) / W;
      const b = (q[1][1] - q[0][1]) / W;
      const c = (q[3][0] - q[0][0]) / H;
      const d = (q[3][1] - q[0][1]) / H;
      return `matrix(${a} ${b} ${c} ${d} ${q[0][0]} ${q[0][1]})`;
    }

    function initShelf() {
      const svg = $('rack');
      const [w, h] = SHELF.size;
      svg.setAttribute('viewBox', `-30 -8 ${w + 60} ${h + 40}`);
      const defs = svgEl('defs', {}, svg);
      const cp = svgEl('clipPath', { id: 'rack-clip' }, defs);
      svgEl('polygon', { points: SHELF.poly.map((p) => p.join(',')).join(' ') }, cp);
      const [SW, SH] = SHELF.spine;
      TEMPLATES.forEach((t) => {
        const l = SHELF.label[t];
        const c = svgEl('clipPath', { id: `lc-${t}` }, defs);
        svgEl('rect', { x: l.x, y: l.y, width: l.w, height: l.h }, c);
      });
      // the tapes only exist inside the open face: clip the moving layer to it
      const xs = SHELF.quads.flatMap((q) => q.map((p) => p[0]));
      const ys = SHELF.quads.flatMap((q) => q.map((p) => p[1]));
      const fc = svgEl('clipPath', { id: 'face-clip' }, defs);
      svgEl('rect', {
        x: Math.min(...xs) - 2, y: Math.min(...ys) - 3, width: Math.max(...xs) - Math.min(...xs) + 4, height: Math.max(...ys) - Math.min(...ys) + 7,
      }, fc);
      const sh = svgEl('filter', { id: 'rack-shadow', x: '-15%', y: '-5%', width: '130%', height: '120%' }, defs);
      svgEl('feDropShadow', { dx: 0, dy: 12, stdDeviation: 14, 'flood-color': '#000', 'flood-opacity': '.7' }, sh);
      const ink = svgEl('filter', { id: 'ink', x: '-5%', y: '-5%', width: '110%', height: '110%' }, defs);
      svgEl('feGaussianBlur', { stdDeviation: '.25' }, ink);
      const body = svgEl('g', { filter: 'url(#rack-shadow)' }, svg);
      const wrap = svgEl('g', { 'clip-path': 'url(#rack-clip)' }, body);
      svgEl('image', { href: '/a/carousel.jpg', width: w, height: h }, wrap);
      svgEl('g', { id: 'deco', 'aria-hidden': 'true' }, svg);
      const face = svgEl('g', { 'clip-path': 'url(#face-clip)' }, svg);
      svgEl('g', { id: 'tapes' }, face);
      svg.dataset.sw = String(SW);
      svg.dataset.sh = String(SH);
      document.fonts.load('600 24px Caveat').then(fitAll, () => {});
      document.fonts.addEventListener('loadingdone', fitAll);
    }

    function pagesCount() {
      return Math.max(1, Math.ceil(shelf.mixes.length / PER_PAGE));
    }

    function motionOff() {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches || typeof Element.prototype.animate !== 'function';
    }

    // Builds the tape layer (a <g class="layer">) for the current rotation position.
    function buildLayer(parent) {
      const g = svgEl('g', { class: 'layer' }, parent);
      const items = shelf.mixes.slice(shelf.page * PER_PAGE, (shelf.page + 1) * PER_PAGE);
      const labels = labelsFor(items);
      const [SW, SH] = SHELF.spine;
      const inDeck = deckId();
      items.forEach((m, i) => {
        if (m.id === inDeck) {
          // the deck tape's slot: real gap photo; the neighbour's case side shows only when a tape stands to the right
          const next = items[i + 1];
          const gap = svgEl('g', { transform: quadMatrix(SHELF.quads[i]), 'aria-hidden': 'true' }, g);
          svgEl('image', { href: next && next.id !== inDeck ? '/a/slot_gap.jpg' : '/a/slot_gap_plain.jpg', width: SW, height: SH }, gap);
          return;
        }
        const hsh = hashId(m.id);
        const tpl = TEMPLATES[hsh % TEMPLATES.length];
        const caseKind = CASES[(hsh >>> 20) % CASES.length];
        const lab = SHELF.label[tpl];
        const date = dateOf(m.mix);
        const meta = [date, minutesOf(m.mix)].filter(Boolean).join(' · ');
        // deterministic per-tape variation: pushed in 0-5 px, scale .99-1, lean +-0.5 deg, brightness +-4%, lighting falloff
        const dy = (hsh >>> 16) % 6;
        const sc = 1 - ((hsh >>> 24) % 11) / 1000;
        const lean = (((hsh >>> 6) % 101) - 50) / 100;
        const bright = (SHELF.light[i] || 1) * (1 + (((hsh >>> 2) % 81) - 40) / 1000);
        const el = svgEl('g', {
          class: 'tape', role: 'button', tabindex: '0', 'data-id': m.id, 'data-slot': String(i),
          'aria-label': date ? `${labels[i]}, ${date}` : labels[i],
          transform: `${quadMatrix(SHELF.quads[i])} translate(0 ${dy}) translate(${SW / 2} ${SH}) rotate(${lean}) scale(${sc}) translate(${-SW / 2} ${-SH})`,
        }, g);
        svgEl('title', {}, el).textContent = meta ? `${labels[i]} · ${meta}` : labels[i];
        const inner = svgEl('g', {}, el);
        const img = svgEl('image', { href: `/a/spine_${tpl}${caseKind}.jpg`, width: SW, height: SH }, inner);
        img.style.filter = `brightness(${bright.toFixed(3)})`;
        const txt = svgEl('g', { 'clip-path': `url(#lc-${tpl})` }, inner);
        const ink = INKS[(hsh >>> 4) % INKS.length];
        const rot = (((hsh >>> 12) % 21) - 10) / 40;
        // title only, running down the spine (rotated 90 degrees clockwise), as large as the writable width allows
        const ig = svgEl('g', { transform: `translate(${lab.x} ${lab.y + 2}) rotate(${90 + rot})`, opacity: '.92', filter: 'url(#ink)', fill: ink }, txt);
        ig.style.mixBlendMode = 'multiply';
        const t1 = svgEl('text', { x: 0, y: -Math.round(lab.w * 0.53), 'data-w': lab.h - 8, 'data-max': 31 }, ig);
        t1.textContent = labels[i];
        svgEl('rect', { width: SW, height: SH, fill: 'transparent' }, inner);
        el.addEventListener('pointerenter', (ev) => el.classList.toggle('hot', ev.pointerType === 'mouse'));
        el.addEventListener('pointerleave', () => el.classList.remove('hot'));
        const open = () => {
          if (performance.now() < shelf.noClickUntil) return;
          openCard(m, labels[i]);
        };
        el.addEventListener('click', open);
        el.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            open();
          }
        });
      });
      return g;
    }

    // Blank spines on the left face: decoration only, shown when there is more than one rotation position.
    function buildDeco(parent) {
      const g = svgEl('g', { class: 'dlayer' }, parent);
      g.style.filter = 'brightness(.72)';
      const [SW, SH] = SHELF.spine;
      SHELF.leftQuads.forEach((q, i) => {
        const tpl = TEMPLATES[hashId(`${shelf.page}:${i}`) % TEMPLATES.length];
        const el = svgEl('g', { transform: quadMatrix(q) }, g);
        svgEl('image', { href: `/a/spine_${tpl}.jpg`, width: SW, height: SH }, el);
      });
      return g;
    }

    function finishTurn() {
      shelf.anim.forEach((a) => a.cancel());
      shelf.anim = [];
      document.querySelectorAll('#tapes > g.layer.out, #deco > g.dlayer.out').forEach((n) => n.remove());
      document.querySelectorAll('#tapes > g.layer, #deco > g.dlayer').forEach((n) => {
        n.classList.remove('in');
        n.style.cssText = n.classList.contains('dlayer') ? 'filter:brightness(.72)' : '';
      });
    }

    // dir: +1 turn right, -1 turn left, 0 redraw without animation
    function renderShelf(dir) {
      finishTurn();
      const tapes = $('tapes');
      const deco = $('deco');
      const pages = pagesCount();
      shelf.page = Math.min(shelf.page, pages - 1);
      const focusSlot = $('shelf').contains(document.activeElement) && document.activeElement.dataset
        ? document.activeElement.dataset.slot : undefined;
      const oldLayers = [...tapes.querySelectorAll(':scope > g.layer')];
      const oldDeco = [...deco.querySelectorAll(':scope > g.dlayer')];
      const layer = buildLayer(tapes);
      const dl = pages > 1 ? buildDeco(deco) : null;
      const animate = dir !== 0 && !motionOff() && oldLayers.length > 0;
      const opts = { duration: TURN_MS, easing: 'ease-in-out', fill: 'both' };
      const done = () => {
        finishTurn();
        fitAll();
      };
      if (animate) {
        oldLayers.forEach((n) => {
          n.classList.add('out');
          n.setAttribute('aria-hidden', 'true');
          n.style.pointerEvents = 'none';
          n.querySelectorAll('.tape').forEach((t) => t.removeAttribute('tabindex'));
          shelf.anim.push(n.animate([{ transform: 'translateX(0px)', opacity: 1 }, { transform: `translateX(${dir * TURN_DX}px)`, opacity: 0 }], opts));
        });
        layer.classList.add('in');
        const inAnim = layer.animate([{ transform: `translateX(${-dir * TURN_DX}px)`, opacity: 0 }, { transform: 'translateX(0px)', opacity: 1 }], opts);
        shelf.anim.push(inAnim);
        oldDeco.forEach((n) => {
          n.classList.add('out');
          shelf.anim.push(n.animate([{ opacity: 1 }, { opacity: 0 }], opts));
        });
        if (dl) {
          dl.classList.add('in');
          shelf.anim.push(dl.animate([{ opacity: 0 }, { opacity: 1 }], opts));
        }
        inAnim.finished.then(done, () => {});
      } else {
        oldLayers.forEach((n) => n.remove());
        oldDeco.forEach((n) => n.remove());
      }
      fitAll();
      const pager = $('pager');
      pager.hidden = pages <= 1;
      $('pg-n').textContent = `${shelf.page + 1} / ${pages}`;
      if (focusSlot !== undefined) {
        const mine = [...layer.querySelectorAll('.tape')];
        const t = mine.find((n) => n.dataset.slot === focusSlot) || mine[0];
        if (t) t.focus({ preventScroll: true });
        else if (!pager.hidden) $('pg-next').focus({ preventScroll: true });
      }
    }

    function syncShelf() {
      if (!shelf.ready) return;
      const key = `${mode}|${deckId()}|${shelf.ver}|${shelf.page}`;
      if (key === shelf.key) return;
      shelf.key = key;
      renderShelf(0);
    }

    // dir: +1 turns right (next position), -1 turns left; wraps around at the ends
    function turn(dir) {
      const pages = pagesCount();
      if (pages < 2) return;
      shelf.page = (shelf.page + dir + pages) % pages;
      shelf.key = `${mode}|${deckId()}|${shelf.ver}|${shelf.page}`;
      renderShelf(dir);
    }

    async function loadMixes() {
      try {
        const res = await fetch('/api/mixes', { cache: 'no-store', credentials: 'same-origin' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const d = await res.json();
        const list = Array.isArray(d && d.mixes) ? d.mixes : [];
        shelf.mixes = list.filter((m) => m && typeof m.id === 'string' && m.mix && typeof m.mix === 'object');
        shelf.ver++;
      } catch (e) {
        return;
      }
      syncShelf();
    }

    shelf.noClickUntil = 0;
    $('pg-prev').addEventListener('click', () => turn(-1));
    $('pg-next').addEventListener('click', () => turn(1));
    $('shelf').addEventListener('keydown', (ev) => {
      if (ev.altKey || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
      if (ev.key === 'ArrowLeft') {
        ev.preventDefault();
        turn(-1);
      } else if (ev.key === 'ArrowRight') {
        ev.preventDefault();
        turn(1);
      }
    });

    // Horizontal swipe on touch: content follows the finger (swipe right = turn right).
    const swipe = { id: null, x: 0, y: 0 };
    $('rack').addEventListener('pointerdown', (ev) => {
      if (ev.pointerType === 'mouse' || !ev.isPrimary) return;
      swipe.id = ev.pointerId;
      swipe.x = ev.clientX;
      swipe.y = ev.clientY;
    });
    $('rack').addEventListener('pointerup', (ev) => {
      if (ev.pointerId !== swipe.id) return;
      swipe.id = null;
      const dx = ev.clientX - swipe.x;
      const dy = ev.clientY - swipe.y;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        shelf.noClickUntil = performance.now() + 400;
        turn(dx > 0 ? 1 : -1);
      }
    });
    $('rack').addEventListener('pointercancel', () => {
      swipe.id = null;
    });

    // ---- tape popup (a J-card) ------------------------------------------------------------

    const card = $('card');
    const cardState = { id: null, mix: null, tracks: [], token: 0, noFocus: false };

    function openCard(m, label) {
      const mix = m.mix;
      cardState.id = m.id;
      cardState.mix = mix;
      cardState.tracks = tracksOf(mix);
      cardState.noFocus = false;
      $('card-title').textContent = label;
      const n = cardState.tracks.length;
      $('card-meta').textContent = [dateOf(mix), minutesOf(mix), n ? `${n} track${n === 1 ? '' : 's'}` : ''].filter(Boolean).join(' · ');
      const ol = $('card-tracks');
      ol.replaceChildren();
      cardState.tracks.forEach((t, i) => {
        const li = document.createElement('li');
        const no = document.createElement('span');
        no.className = 'tn';
        no.textContent = String(i + 1);
        const tm = document.createElement('span');
        tm.className = 'tm';
        tm.textContent = fmt(t.start_seconds);
        const tx = document.createElement('span');
        tx.textContent = [t.artist, t.title].filter(Boolean).join(' - ') || 'Unknown track';
        li.append(no, tm, tx);
        ol.appendChild(li);
      });
      ol.hidden = !n;
      const go = $('card-go');
      go.disabled = true;
      $('card-note').textContent = '';
      card.showModal();
      go.blur();
      const token = ++cardState.token;
      const failed = () => {
        if (token === cardState.token && card.open) $('card-note').textContent = 'Tape not ready yet';
      };
      fetch(tapeUrl(m.id), { method: 'HEAD', credentials: 'same-origin' }).then((r) => {
        if (token !== cardState.token || !card.open) return;
        if (r.ok) go.disabled = false;
        else failed();
      }, failed);
    }

    card.addEventListener('click', (ev) => {
      if (ev.target === card) card.close();
    });
    $('card-cancel').addEventListener('click', () => card.close());

    const help = $('help');
    $('help-btn').addEventListener('click', () => help.showModal());
    $('help-close').addEventListener('click', () => help.close());
    help.addEventListener('click', (ev) => {
      if (ev.target === help) help.close();
    });
    card.addEventListener('close', () => {
      cardState.token++;
      if (cardState.noFocus) return;
      const el = [...document.querySelectorAll('#tapes .tape')].find((t) => t.dataset.id === cardState.id);
      if (el) el.focus();
    });

    // Runs inside the click (iOS needs the gesture for play()).
    $('card-go').addEventListener('click', () => {
      if ($('card-go').disabled) return;
      cardState.noFocus = true;
      card.close();
      deckChange(deckLabel(cardState.mix, cardState.id, cardState.tracks));
      keyClick();
      endWind(false);
      setMusic(true);
      if (!playing) begin();
      else if (paused) {
        paused = false;
        syncKeys();
      }
      enterTape(cardState.id, cardState.mix, cardState.tracks, 0);
      setStatus('');
      render();
    });

    initShelf();
    shelf.ready = true;
    loadMixes();
    setInterval(loadMixes, 300000);

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        load();
        loadMixes();
      }
    });

    load();
    setInterval(load, 30000);
    setInterval(render, 1000);

    // Phones: show only the centre unit (dial, knobs, decks, keys), about twice as large.
    const narrow = window.matchMedia('(max-width: 700px)');
    const fitBox = () => $('box').setAttribute('viewBox', narrow.matches ? '490 100 960 620' : '0 0 1920 768');
    narrow.addEventListener('change', fitBox);
    fitBox();
