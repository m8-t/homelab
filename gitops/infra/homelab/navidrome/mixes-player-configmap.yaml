    control('key-pause', () => { keyPress(); pauseKey(); });
    control('key-stop', () => { keyPress(); stop(); });
    $('live-btn').addEventListener('click', backToLive);

    // FUNCTION switch: TAPE -> back to live; RADIO -> the live mix continues as a tape from the same spot.
    function fnSwitch() {
      keyPress();
      if (mode === 'tape') {
        backToLive();
        return;
      }
      const v = view();
      if (v.id === null || !v.mix) return;
      const pos = position();
      endWind(false);
      setMusic(true);
      if (!playing) begin();
      else if (paused) {
        paused = false;
        syncKeys();
      }
      enterTape(v.id, v.mix, v.tracks, pos);
      setStatus('');
      render();
