---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiim-bridge
  namespace: navidrome
  labels:
    app: wiim-bridge
data:
  # must equal the address of Service wiim-bridge-lan
  BRIDGE_ADVERTISE_HOST: "172.16.20.111"
  # audio-only port for the WiiM; the only port Service wiim-bridge-lan exposes
  BRIDGE_DEVICE_PORT: "8099"
  # the WiiM amplifier
  BRIDGE_DEVICE_HOST: "172.16.20.211"
  BRIDGE_NAVIDROME_URL: "http://navidrome.navidrome.svc.cluster.local:4533"
  # info while an intermittent resume bug is being watched; warn is the quiet setting
  BRIDGE_LOG_LEVEL: "info"
  # report plays to Navidrome as the bridge user; Feishin's own scrobbling must be off
  BRIDGE_SCROBBLE: "true"
