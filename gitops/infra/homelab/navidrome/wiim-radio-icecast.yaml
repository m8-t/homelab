---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiim-radio-icecast
  namespace: navidrome
  labels:
    app.kubernetes.io/name: wiim-radio-icecast
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wiim-radio-icecast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wiim-radio-icecast
    spec:
      automountServiceAccountToken: false
      containers:
        - name: icecast
          # Multi-arch (linux/amd64 and linux/arm64). Icecast 2.4.4.
          image: libretime/icecast:2.5.0@sha256:6de21a17791128d2b204edeb7661cc81a304c7eeed5b540050c47b654b3e5b3b
          env:
            - name: ICECAST_SOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wiim-bridge-radio
                  key: ICECAST_SOURCE_PASSWORD
            - name: ICECAST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wiim-bridge-radio
                  key: ICECAST_ADMIN_PASSWORD
            - name: ICECAST_RELAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wiim-bridge-radio
                  key: ICECAST_ADMIN_PASSWORD
            # Listener limit.
            - name: ICECAST_MAX_CLIENTS
              value: "20"
            # /radio.mp3 + /mixes.mp3, with room for a reconnect overlap.
            - name: ICECAST_MAX_SOURCES
              value: "4"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
# LAN listeners (ETS2 on the desktop); also the ClusterIP Liquidsoap pushes to
apiVersion: v1
kind: Service
metadata:
  name: wiim-radio-icecast
  namespace: navidrome
  labels:
    app.kubernetes.io/name: wiim-radio-icecast
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.16.20.112"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: wiim-radio-icecast
  ports:
    - name: http
      port: 8000
      targetPort: http
    # Same Icecast, second port: ETS2's Mixes station uses :8002 so the desktop HUD wrapper can tell
    # from the socket (ss) which mount the game is playing.
    - name: http-mixes
      port: 8002
      targetPort: http
