---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixes-player
  namespace: navidrome
  labels:
    app: mixes-player
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mixes-player
  template:
    metadata:
      labels:
        app: mixes-player
      annotations:
        backup.velero.io/backup-volumes-excludes: tapes
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # nginx stable 1.30.4-alpine, multi-arch index digest (linux/amd64, linux/arm64)
          image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: conf
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
            - name: conf
              mountPath: /usr/share/nginx/html/app.js
              subPath: app.js
              readOnly: true
            - name: assets
              mountPath: /usr/share/nginx/html/a
              readOnly: true
            - name: tapes
              mountPath: /tapes
              readOnly: true
            - name: mixes
              mountPath: /mixes
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: conf
          configMap:
            name: mixes-player
        - name: assets
          configMap:
            name: mixes-player-assets
        - name: tapes
          persistentVolumeClaim:
            claimName: navidrome-mixes-mp3
            readOnly: true
        - name: mixes
          persistentVolumeClaim:
            claimName: navidrome-mixes
            readOnly: true
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mixes-player
  namespace: navidrome
  labels:
    app: mixes-player
spec:
  selector:
    app: mixes-player
  ports:
    - name: http
      port: 8080
      targetPort: http
