---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiim-bridge
  namespace: navidrome
  labels:
    app: wiim-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wiim-bridge
  template:
    metadata:
      labels:
        app: wiim-bridge
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wiim-bridge
          image: ghcr.io/m8-t/navidrome-wiim-bridge:0.11.0@sha256:3599a009e4d2d2598bb6afc1e751cb2a82f33129b2f6408c2175eab195ffb6ee
          envFrom:
            - configMapRef:
                name: wiim-bridge
            - secretRef:
                name: wiim-bridge
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          ports:
            - name: http
              containerPort: 8098
            - name: device
              containerPort: 8099
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
