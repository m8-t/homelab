---
# Uploads node3's local etcd snapshots to Hetzner (bucket m8t-etcd) with
# client-side encryption via rclone crypt. Replaces k3s's built-in etcd-s3
# upload, which cannot encrypt (k3s#14002) and stored snapshots in plaintext.
#
# rclone sync mirrors the local dir, so k3s retention pruning (12 snapshots,
# 12 days at daily cadence) propagates to the bucket. Runs daily at 00:30,
# 30 min after the midnight k3s snapshot (etcd-snapshot-schedule-cron: 0 0).
#
# Restore: rclone copy crypt:<name> . --config rclone.conf (same conf as in
# the etcd-offsite-rclone secret), then k3s server --cluster-reset
# --cluster-reset-restore-path=<snapshot>.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-snapshot-offsite
  namespace: etcd-offsite
spec:
  schedule: "30 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          nodeSelector:
            kubernetes.io/hostname: node3
          restartPolicy: Never
          containers:
            - name: rclone
              image: rclone/rclone:latest
              args:
                - sync
                - /snapshots
                - "crypt:"
                - --config=/config/rclone.conf
                - --s3-no-check-bucket
                # abort instead of mirroring a mass deletion if the local
                # snapshot dir is unexpectedly empty (e.g. fresh rebuild)
                - --max-delete=3
                - -v
              volumeMounts:
                - name: snapshots
                  mountPath: /snapshots
                  readOnly: true
                - name: rclone-config
                  mountPath: /config
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: snapshots
              hostPath:
                path: /var/lib/rancher/k3s/server/db/snapshots
                type: Directory
            - name: rclone-config
              secret:
                secretName: etcd-offsite-rclone
