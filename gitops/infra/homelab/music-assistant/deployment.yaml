---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
  namespace: music-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: music-assistant
  template:
    metadata:
      labels:
        app: music-assistant
    spec:
      nodeSelector:
        kubernetes.io/hostname: node4
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: music-assistant
          image: ghcr.io/music-assistant/server:2.9.10
          securityContext:
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN, NET_RAW]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 6Gi
          ports:
            - name: http
              containerPort: 8095
            - name: stream
              containerPort: 8097
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /media
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-data
        - name: music
          persistentVolumeClaim:
            claimName: music-assistant-music
            readOnly: true
