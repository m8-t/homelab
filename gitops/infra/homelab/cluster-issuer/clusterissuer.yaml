---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-ionos-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: acme@m8t.io
    privateKeySecretRef:
      name: letsencrypt-ionos-prod-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.fabmade.de
            solverName: ionos
            config:
              apiUrl: https://api.hosting.ionos.com/dns/v1
              publicKeySecretRef:
                name: ionos-secret
                key: IONOS_PUBLIC_PREFIX
              secretKeySecretRef:
                name: ionos-secret
                key: IONOS_SECRET
