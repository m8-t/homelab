---
# Pushes the local *.m8t.io wildcard cert to the VPS as kube-system/wildcard-tls.
# The whole secret is pushed in one write (no per-key property): the remote is
# typed kubernetes.io/tls, which the API rejects unless tls.crt AND tls.key
# arrive together. Mapping the keys separately writes tls.crt alone first and
# fails with "data[tls.key]: Required value".
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: wildcard-tls
  namespace: envoy-gateway-system
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: vps
      kind: SecretStore
  selector:
    secret:
      name: wildcard-tls
  template:
    type: kubernetes.io/tls
  data:
    - match:
        remoteRef:
          remoteKey: wildcard-tls
