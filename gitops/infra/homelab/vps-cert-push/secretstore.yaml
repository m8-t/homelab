---
# Writes secrets into the VPS cluster over the tunnel. Auth via the eso-writer
# SA token on the VPS (sealed here as vps-eso-token). remoteNamespace kube-system
# is where the VPS Traefik TLSStore reads the wildcard cert from.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vps
  namespace: envoy-gateway-system
spec:
  provider:
    kubernetes:
      remoteNamespace: kube-system
      server:
        url: https://10.99.0.1:6443
        caProvider:
          type: ConfigMap
          name: vps-ca
          key: ca.crt
      auth:
        token:
          bearerToken:
            name: vps-eso-token
            key: token
