---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiosk-home
  namespace: kiosk-home
  labels:
    app: kiosk-home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kiosk-home
  template:
    metadata:
      labels:
        app: kiosk-home
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kiosk-home
          image: ghcr.io/m8-t/kiosk-home:0.5.0@sha256:973387dd368c62a4b05ae840bb509c46266a8a3d134cd8e9c5614cd2273f6709
          envFrom:
            - configMapRef:
                name: kiosk-home
            - secretRef:
                name: kiosk-home
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 5m
              memory: 48Mi
            limits:
              memory: 128Mi
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kiosk-home-links
        - name: tmp
          emptyDir: {}
