---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerts-node
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  node-alerts.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: node-alerts
        folder: Alerts
        interval: 1m
        rules:
          - uid: node-down
            title: Node Down
            condition: B
            noDataState: Alerting
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: 'up{job="node-exporter", cluster!="vps"}'
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: lt
                        params: [1]
                  refId: B
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: 'Node {{ $labels.instance }} is unreachable'

          - uid: node-high-memory
            title: High Memory Usage
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: '(1 - node_memory_MemAvailable_bytes{cluster!="vps"} / node_memory_MemTotal_bytes{cluster!="vps"}) * 100'
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params: [90]
                  refId: B
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: 'Memory usage above 90% on {{ $labels.instance }}'

          - uid: node-high-disk
            title: High Disk Usage
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: >-
                    max by (instance) (
                    (1 - node_filesystem_avail_bytes{fstype=~"btrfs|ext4|xfs",mountpoint!~"/boot.*|/.snapshots",cluster!="vps"}
                    / node_filesystem_size_bytes{fstype=~"btrfs|ext4|xfs",mountpoint!~"/boot.*|/.snapshots",cluster!="vps"}) * 100
                    )
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params: [85]
                  refId: B
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: 'Disk usage above 85% on {{ $labels.instance }} (highest filesystem)'

          - uid: node-fs-readonly
            title: Filesystem Read-Only
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  # whitelist rw mounts only: MicroOS root is ro by design
                  expr: 'node_filesystem_readonly{fstype=~"btrfs|ext4|xfs",mountpoint=~"/var|/home|/var/lib/rancher|/var/lib/rustfs",cluster!="vps"}'
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                  refId: B
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: 'Filesystem {{ $labels.mountpoint }} remounted read-only on {{ $labels.instance }} -- failing storage medium likely'

          - uid: node-fs-device-error
            title: Filesystem Device Error
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: 'node_filesystem_device_error{fstype=~"btrfs|ext4|xfs",cluster!="vps"}'
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
                  refId: B
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: 'Device errors on filesystem {{ $labels.mountpoint }} ({{ $labels.device }}) on {{ $labels.instance }}'

          - uid: node-high-cpu
            title: High CPU Usage
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: '(1 - avg by(instance) (rate(node_cpu_seconds_total{mode="idle",cluster!="vps"}[5m]))) * 100'
                  instant: true
                  refId: A
              - refId: B
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params: [90]
                  refId: B
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: 'CPU usage above 90% on {{ $labels.instance }}'
