---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-velero
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Infrastructure
data:
  velero.json: |
    {
      "title": "Velero Backups",
      "uid": "homelab-velero",
      "timezone": "browser",
      "refresh": "5m",
      "time": { "from": "now-7d", "to": "now" },
      "panels": [
        {
          "title": "Last Successful Backup",
          "type": "stat",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "dateTimeFromNow",
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "velero_backup_last_successful_timestamp{schedule!=\"\"} * 1000",
              "legendFormat": "{{ schedule }}"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Hours Since Last Backup",
          "type": "stat",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "decimals": 1,
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 25 },
                  { "color": "red", "value": 48 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "(time() - velero_backup_last_successful_timestamp{schedule!=\"\"}) / 3600",
              "legendFormat": "{{ schedule }}"
            }
          ],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "title": "Total Successful Backups",
          "type": "stat",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "green", "mode": "fixed" }
            }
          },
          "options": {
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "velero_backup_success_total{schedule!=\"\"}",
              "legendFormat": "{{ schedule }}"
            }
          ]
        },
        {
          "title": "Total Backup Failures",
          "type": "stat",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            }
          },
          "options": {
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "targets": [
            {
              "expr": "velero_backup_failure_total{schedule!=\"\"}",
              "legendFormat": "{{ schedule }}"
            }
          ]
        },
        {
          "title": "Backup Duration",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "min",
              "custom": { "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "velero_backup_duration_seconds_sum{schedule!=\"\"} / 60",
              "legendFormat": "{{ schedule }}"
            }
          ]
        }
      ],
      "schemaVersion": 39
    }
