---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kiosk-tablet
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  kiosk-tablet.json: |
    {
      "title": "Kiosk Tablet",
      "uid": "kiosk-tablet",
      "tags": ["kiosk"],
      "timezone": "browser",
      "refresh": "1m",
      "time": { "from": "now-7d", "to": "now" },
      "schemaVersion": 39,
      "panels": [
        {
          "type": "stat",
          "title": "Battery",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "termux_battery_percent{job=\"kiosk-tablet\"}", "instant": true }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 30 },
                  { "color": "green", "value": 50 }
                ]
              }
            }
          },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "type": "stat",
          "title": "Temperature",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "termux_battery_temperature_celsius{job=\"kiosk-tablet\"}", "instant": true }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 35 },
                  { "color": "red", "value": 40 }
                ]
              }
            }
          },
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "type": "stat",
          "title": "Status",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "termux_battery_status{job=\"kiosk-tablet\"} == 1", "instant": true, "legendFormat": "{{status}}" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "text" } } },
          "options": { "textMode": "name", "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "type": "stat",
          "title": "Power source",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "termux_battery_plugged{job=\"kiosk-tablet\"} == 1", "instant": true, "legendFormat": "{{source}}" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "text" } } },
          "options": { "textMode": "name", "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "type": "stat",
          "title": "Health",
          "gridPos": { "x": 16, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "termux_battery_health{job=\"kiosk-tablet\"} == 1", "instant": true, "legendFormat": "{{health}}" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "fixed", "fixedColor": "text" } } },
          "options": { "textMode": "name", "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "type": "stat",
          "title": "Exporter",
          "gridPos": { "x": 20, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "up{job=\"kiosk-tablet\"}", "instant": true }
          ],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "Offline", "color": "red" }, "1": { "text": "Online", "color": "green" } } }
              ]
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "type": "timeseries",
          "title": "Battery level",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "termux_battery_percent{job=\"kiosk-tablet\"}", "legendFormat": "battery" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "fillOpacity": 10, "thresholdsStyle": { "mode": "dashed" } },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "transparent", "value": null }, { "color": "red", "value": 30 }] }
            }
          },
          "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "single" } }
        },
        {
          "type": "timeseries",
          "title": "Temperature",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "termux_battery_temperature_celsius{job=\"kiosk-tablet\"}", "legendFormat": "battery" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": { "fillOpacity": 10, "thresholdsStyle": { "mode": "dashed" } },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "transparent", "value": null }, { "color": "red", "value": 40 }] }
            }
          },
          "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "single" } }
        },
        {
          "type": "timeseries",
          "title": "Current (negative = discharging)",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "termux_battery_current_microamps{job=\"kiosk-tablet\"} / 1000", "legendFormat": "current" }
          ],
          "fieldConfig": { "defaults": { "unit": "mamp", "custom": { "fillOpacity": 10 } } },
          "options": { "legend": { "showLegend": false }, "tooltip": { "mode": "single" } }
        },
        {
          "type": "state-timeline",
          "title": "Power source",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "termux_battery_plugged{job=\"kiosk-tablet\"} == 1", "legendFormat": "{{source}}" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } } },
          "options": { "showValue": "never", "mergeValues": true, "legend": { "showLegend": true } }
        }
      ]
    }
