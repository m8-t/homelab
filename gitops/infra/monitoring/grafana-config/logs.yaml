---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Infrastructure
data:
  logs.json: |
    {
      "title": "Logs",
      "uid": "homelab-logs",
      "timezone": "browser",
      "refresh": "",
      "time": { "from": "now-1h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "loki" },
            "query": { "label": "namespace", "stream": "", "type": 1 },
            "includeAll": true,
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "multi": true,
            "refresh": 2
          },
          {
            "name": "pod",
            "type": "query",
            "datasource": { "type": "loki" },
            "query": { "label": "pod", "stream": "{namespace=~\"$namespace\"}", "type": 1 },
            "includeAll": true,
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "multi": true,
            "refresh": 2
          },
          {
            "name": "search",
            "type": "textbox",
            "current": { "selected": false, "text": "", "value": "" }
          }
        ]
      },
      "panels": [
        {
          "title": "Log Volume",
          "type": "timeseries",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki" },
          "fieldConfig": { "defaults": { "custom": { "fillOpacity": 30, "stacking": { "mode": "normal" } } } },
          "targets": [
            {
              "expr": "sum by (namespace) (count_over_time({namespace=~\"$namespace\", pod=~\"$pod\"} |~ \"$search\" [1m]))",
              "legendFormat": "{{ namespace }}"
            }
          ]
        },
        {
          "title": "Logs",
          "type": "logs",
          "gridPos": { "h": 18, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "loki" },
          "options": {
            "showTime": true,
            "showLabels": true,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "sortOrder": "Descending",
            "dedupStrategy": "none"
          },
          "targets": [
            {
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\"} |~ \"$search\"",
              "maxLines": 500
            }
          ]
        }
      ],
      "schemaVersion": 39
    }
