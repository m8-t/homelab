---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Infrastructure
data:
  cluster.json: |
    {
      "title": "Cluster Overview",
      "uid": "homelab-cluster",
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "title": "Pods Running",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }] } } },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Running\"})" }]
        },
        {
          "title": "Pods Pending",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 1 }] } } },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Pending\"}) or vector(0)" }]
        },
        {
          "title": "Pods Failed",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } } },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Failed\"}) or vector(0)" }]
        },
        {
          "title": "Deployments Unavailable",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } } },
          "targets": [{ "expr": "count(kube_deployment_status_replicas_unavailable > 0) or vector(0)" }]
        },
        {
          "title": "Container Restarts (24h)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 5 }, { "color": "red", "value": 20 }] } } },
          "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total[24h]))" }]
        },
        {
          "title": "CPU Requests vs Capacity",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 4 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } },
          "targets": [{ "expr": "sum(kube_pod_container_resource_requests{resource=\"cpu\"}) / sum(kube_node_status_allocatable{resource=\"cpu\"})" }]
        },
        {
          "title": "Memory Requests vs Capacity",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 4 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.7 }, { "color": "red", "value": 0.9 }] } } },
          "targets": [{ "expr": "sum(kube_pod_container_resource_requests{resource=\"memory\"}) / sum(kube_node_status_allocatable{resource=\"memory\"})" }]
        },
        {
          "title": "Pods by Namespace",
          "type": "piechart",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 4 },
          "datasource": { "type": "prometheus" },
          "targets": [{ "expr": "sum by (namespace) (kube_pod_status_phase{phase=\"Running\"})", "legendFormat": "{{ namespace }}" }]
        },
        {
          "title": "Top Restarting Containers (24h)",
          "type": "table",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "datasource": { "type": "prometheus" },
          "fieldConfig": { "defaults": { "custom": { "filterable": true } } },
          "targets": [{ "expr": "topk(10, increase(kube_pod_container_status_restarts_total[24h]) > 0)", "format": "table", "instant": true }],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true, "__name__": true, "endpoint": true, "instance": true, "job": true, "service": true, "uid": true }, "renameByName": { "Value": "Restarts", "container": "Container", "namespace": "Namespace", "pod": "Pod" } } }
          ]
        },
        {
          "title": "Deployments",
          "type": "table",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "datasource": { "type": "prometheus" },
          "targets": [
            { "expr": "kube_deployment_status_replicas", "format": "table", "instant": true, "refId": "A" },
            { "expr": "kube_deployment_status_replicas_available", "format": "table", "instant": true, "refId": "B" }
          ],
          "transformations": [
            { "id": "seriesToColumns", "options": { "byField": "deployment" } },
            { "id": "organize", "options": { "excludeByName": { "Time 1": true, "Time 2": true, "__name__ 1": true, "__name__ 2": true, "endpoint 1": true, "endpoint 2": true, "instance 1": true, "instance 2": true, "job 1": true, "job 2": true, "service 1": true, "service 2": true, "namespace 2": true }, "renameByName": { "Value 1": "Desired", "Value 2": "Available", "deployment": "Deployment", "namespace 1": "Namespace" } } }
          ]
        }
      ],
      "schemaVersion": 39
    }
