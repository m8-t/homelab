---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  repo: https://bitnami.github.io/sealed-secrets
  chart: sealed-secrets
  version: "2.20.0"
  targetNamespace: kube-system
  valuesContent: |-
    secretName: "sealed-secrets-key"
    keyrenewperiod: "0"
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
