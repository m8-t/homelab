---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: homelab
  sources:
    - repoURL: https://github.com/rustfs/rustfs
      path: helm/rustfs
      targetRevision: 1.0.0-alpha.91
      helm:
        valuesObject:
          secret:
            existingSecret: rustfs-credentials
          mode:
            distributed:
              enabled: false
            standalone:
              enabled: true
              existingClaim:
                dataClaim: rustfs-data
          config:
            rustfs:
              log_level: warn
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 512Mi
          ingress:
            enabled: false
          nodeSelector:
            kubernetes.io/hostname: node3
    - repoURL: https://gitlab.com/dan361/homelab-ops.git
      targetRevision: main
      path: gitops/infra/homelab/rustfs
  destination:
    server: https://kubernetes.default.svc
    namespace: rustfs
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
