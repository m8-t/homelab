---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  sourceHydrator:
    drySource:
      repoURL: git@gitlab.com:dan361/homelab-ops.git
      targetRevision: main
      path: gitops/dry/headlamp
    syncSource:
      targetBranch: hydrated
      path: headlamp
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
