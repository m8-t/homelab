---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  sources:
    - repoURL: https://aquasecurity.github.io/helm-charts
      chart: trivy-operator
      targetRevision: 0.35.0
      helm:
        values: |
          operator:
            scanJobsConcurrentLimit: 1
            builtInTrivyServer: true
            # Per-CVE metric; required by dashboard 22010 (Image CVE Data)
            # variable query. Chart default is false for cardinality reasons;
            # cluster is small enough that the extra series are a non-issue.
            metricsVulnIdEnabled: true
            # Auto-delete completed scan jobs; default is empty (never cleaned up).
            scanJobTTL: 1h
          trivy:
            valuesFromConfigMap: trivy-server-tmpdir
            severity: HIGH,CRITICAL
            ignoreUnfixed: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          serviceMonitor:
            enabled: true
            interval: 30s
    - repoURL: https://gitlab.com/dan361/homelab-ops.git
      targetRevision: main
      path: gitops/infra/homelab/trivy
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
