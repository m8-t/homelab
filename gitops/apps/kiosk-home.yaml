---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiosk-home
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  source:
    repoURL: https://gitlab.com/dan361/homelab-ops.git
    targetRevision: main
    path: gitops/infra/homelab/kiosk-home
  destination:
    server: https://kubernetes.default.svc
    namespace: kiosk-home
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
