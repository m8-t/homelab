---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: homelab
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: 12.1.0
      helm:
        valuesObject:
          initContainers:
            - name: velero-plugin-for-aws
              image: velero/velero-plugin-for-aws:v1.14.0
              imagePullPolicy: IfNotPresent
              volumeMounts:
                - mountPath: /target
                  name: plugins

          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
            nodeAgentPodMonitor:
              enabled: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          nodeSelector:
            m8t.io/storage: sd

          credentials:
            useSecret: false

          configuration:
            backupStorageLocation:
              - name: rustfs
                provider: aws
                bucket: velero
                default: true
                credential:
                  name: velero-credentials-rustfs
                  key: cloud
                config:
                  region: minio
                  s3ForcePathStyle: "true"
                  s3Url: http://rustfs-svc.rustfs.svc.cluster.local:9000
              - name: hetzner
                provider: aws
                bucket: m8t-k3s
                credential:
                  name: velero-credentials-hetzner
                  key: cloud
                config:
                  region: nbg1
                  s3ForcePathStyle: "true"
                  s3Url: https://nbg1.your-objectstorage.com
                  customerKeyEncryptionSecret: "velero-sse-c-key/key"

          snapshotsEnabled: false
          deployNodeAgent: true

          nodeAgent:
            nodeSelector:
              m8t.io/storage: sd
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

          schedules:
            daily-rustfs:
              disabled: false
              schedule: "0 2 * * *"
              template:
                ttl: "720h"
                storageLocation: rustfs
                defaultVolumesToFsBackup: true
                includedNamespaces:
                  - vaultwarden
                  - music-assistant
                  - yamtrack
                excludedResources:
                  - httproutes.gateway.networking.k8s.io
                resourcePolicy:
                  kind: ConfigMap
                  name: velero-volume-policy
            daily-hetzner:
              disabled: false
              schedule: "0 3 * * *"
              template:
                ttl: "720h"
                storageLocation: hetzner
                defaultVolumesToFsBackup: true
                includedNamespaces:
                  - vaultwarden
                  - music-assistant
                  - yamtrack
                excludedResources:
                  - httproutes.gateway.networking.k8s.io
                resourcePolicy:
                  kind: ConfigMap
                  name: velero-volume-policy

    - repoURL: https://gitlab.com/dan361/homelab-ops.git
      targetRevision: main
      path: gitops/infra/homelab/velero
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
