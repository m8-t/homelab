---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k3s-upgrade
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: homelab
  source:
    repoURL: https://gitlab.com/dan361/homelab-ops.git
    targetRevision: main
    path: gitops/infra/homelab/k3s-upgrade
  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade
  syncPolicy:
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
