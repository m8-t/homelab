---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-remote
  namespace: monitoring
---
apiVersion: v1
kind: Secret
metadata:
  name: prometheus-remote-token
  namespace: monitoring
  annotations:
    kubernetes.io/service-account.name: prometheus-remote
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-remote
rules:
  - apiGroups: [""]
    resources:
      - nodes/proxy
      - nodes/metrics
      - pods/proxy
      - services/proxy
    verbs: [get]
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - endpoints
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-remote
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-remote
subjects:
  - kind: ServiceAccount
    name: prometheus-remote
    namespace: monitoring
