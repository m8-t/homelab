---
- name: Create sealed-secrets key and cert directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ addons_sealed_secrets_key_path | dirname }}"
    - "{{ addons_sealed_secrets_cert_path | dirname }}"
  delegate_to: localhost
  become: false

- name: Generate Sealed Secrets keypair
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -days 3650 -nodes -newkey rsa:4096
      -keyout {{ addons_sealed_secrets_key_path }}
      -out {{ addons_sealed_secrets_cert_path }}
      -subj "/CN=sealed-secrets/O=sealed-secrets"
    creates: "{{ addons_sealed_secrets_cert_path }}"
  delegate_to: localhost
  become: false

- name: Apply Sealed Secrets keypair
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'sealed-secrets-key-secret.yaml.j2') | from_yaml }}"
  delegate_to: localhost
  become: false

- name: Deploy Sealed Secrets HelmChart
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'sealed-secrets-helmchart.yaml.j2') | from_yaml }}"
  delegate_to: localhost
  become: false

- name: Wait for Sealed Secrets controller
  kubernetes.core.k8s_info:
    kind: Deployment
    name: sealed-secrets
    namespace: kube-system
  register: addons_ss_deploy
  until: >
    addons_ss_deploy.resources is defined and
    addons_ss_deploy.resources | length > 0 and
    (addons_ss_deploy.resources[0].status.availableReplicas | default(0)) ==
    addons_ss_deploy.resources[0].spec.replicas
  retries: 30
  delay: 10
  delegate_to: localhost
  become: false
