---
all:
  vars:
    ansible_user: dan
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_python_interpreter: /usr/bin/python3

  children:
    k3s_servers:
      hosts:
        node3:
          ansible_host: 172.16.20.80

    k3s_agents:
      hosts:
        node1:
          ansible_host: 172.16.20.82
        node4:
          ansible_host: 172.16.20.83

    # addons.yml targets this group -- use -l to select node
    k3s_init_server:
      hosts:
        node3:
          ansible_host: 172.16.20.80
        node4:
          ansible_host: 172.16.20.83

    vpn_proxy:
      hosts:
        node2:
          ansible_host: 172.16.20.81

    # Nodes that participate in the k3s embedded registry (Spegel) P2P image
    # cache. All cluster nodes (storage cost is zero, containerd GC handles
    # eviction).
    image_cache_nodes:
      hosts:
        node1:
          ansible_host: 172.16.20.82
        node3:
          ansible_host: 172.16.20.80
        node4:
          ansible_host: 172.16.20.83
